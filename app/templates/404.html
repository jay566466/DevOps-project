{% extends "base.html" %}
{% block title %}404 — Not Found{% endblock %}
{% block content %}
<div class="page-wrapper" style="text-align:center; padding-top: 100px;">
    <div style="font-size:80px; margin-bottom:16px;">🔍</div>
    <h1 class="page-title" style="font-size:64px; color: var(--accent);">404</h1>
    <p class="page-subtitle" style="font-size:18px; margin-top:12px;">The page you're looking for doesn't exist.</p>
    <div style="margin-top:32px; display:flex; gap:12px; justify-content:center;">
        <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary">Go to Dashboard</a>
        <a href="javascript:history.back()" class="btn btn-ghost">Go Back</a>
    </div>
</div>
{% endblock %}
